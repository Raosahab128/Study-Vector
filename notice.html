<style>
.notice-board{
    max-width:1200px;
    margin:20px auto;
    padding:18px;
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:14px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
    font-family:Arial,sans-serif;
}

.notice-header{
    display:flex;
    align-items:center;
    gap:10px;
    padding-bottom:12px;
    margin-bottom:12px;
    border-bottom:1px solid #eee;
}

.notice-header h3{
    margin:0;
    font-size:22px;
    color:#222;
}

.notice-list{
    list-style:none;
    margin:0;
    padding:0;
}

.notice-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 0;
    border-bottom:1px solid #f1f1f1;
}

.notice-item:last-child{
    border-bottom:none;
}

.notice-content{
    display:flex;
    align-items:center;
    gap:10px;
}

.notice-badge{
    background:#2563eb;
    color:#fff;
    padding:4px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.notice-badge.update{
    background:#ef4444;
}

.notice-text{
    text-decoration:none;
    color:#333;
    transition:.3s;
}

.notice-text:hover{
    color:#2563eb;
}

.notice-date{
    color:#666;
    font-size:13px;
}

@media(max-width:768px){
.notice-item{
    flex-direction:column;
    align-items:flex-start;
    gap:8px;
}
}
</style>

<div class="notice-board">

    <div class="notice-header">
        <span style="font-size:28px;">📢</span>
        <h3>Important Notices & Updates</h3>
    </div>

    <ul class="notice-list">

        <li class="notice-item">
            <div class="notice-content">
                <span class="notice-badge">NEW</span>
                <a href="notes.html" class="notice-text">
                    Semester 1 ke naye handwritten notes upload kar diye gaye hain!
                </a>
            </div>
            <span class="notice-date">25 July</span>
        </li>

        <li class="notice-item">
            <div class="notice-content">
                <span class="notice-badge update">UPDATE</span>
                <a href="Contact.html" class="notice-text">
                    Kisi bhi query ya help ke liye Contact page se direct message bhej sakte hain.
                </a>
            </div>
            <span class="notice-date">24 July</span>
        </li>

    </ul>

</div>
