<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Study Vector Notice Board</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{

background:#eef4ff;
padding:30px;

}


/* MAIN BACKGROUND */

.notice-area{

position:relative;
overflow:hidden;
padding:40px 0;

}


.notice-area::before{

content:"";

position:absolute;

inset:0;

background-image:

linear-gradient(#2563eb15 1px,transparent 1px),
linear-gradient(90deg,#2563eb15 1px,transparent 1px);

background-size:35px 35px;

animation:gridMove 15s linear infinite;

}


.notice-area::after{

content:"";

position:absolute;

width:350px;
height:350px;

background:#2563eb;

border-radius:50%;

filter:blur(120px);

opacity:.25;

right:-120px;
top:-100px;

animation:glowMove 6s infinite alternate;

}



.notice-board{

position:relative;
z-index:2;

width:95%;
max-width:1100px;

margin:auto;

background:#fff;

border-radius:25px;

overflow:hidden;

box-shadow:

0 20px 50px rgba(0,0,0,.12);

}



/* HEADER */


.notice-header{

display:flex;

justify-content:space-between;

align-items:center;

padding:25px;

background:

linear-gradient(135deg,#2563eb,#0f172a);

position:relative;

overflow:hidden;

}


.notice-header::before{

content:"";

position:absolute;

width:350px;

height:350px;

background:white;

opacity:.08;

border-radius:50%;

right:-150px;

top:-150px;

}



.notice-left{

display:flex;

align-items:center;

gap:18px;

z-index:2;

}



.notice-icon{

width:75px;

height:75px;

display:flex;

align-items:center;

justify-content:center;

border-radius:50%;

background:rgba(255,255,255,.15);

font-size:35px;

animation:pulse 2s infinite;

}



@keyframes pulse{

50%{

transform:scale(1.12);

}

}



.notice-title span{

font-size:12px;

letter-spacing:2px;

color:#bfdbfe;

font-weight:700;

}



.notice-title h2{

font-size:30px;

margin:7px 0;

font-weight:800;

color:white;

animation:titleGlow 5s infinite;

}



.notice-title p{

color:#dbeafe;

font-size:14px;

}



@keyframes titleGlow{

50%{

text-shadow:

0 0 15px #60a5fa;

}

}



.notice-status{

z-index:2;

background:rgba(255,255,255,.15);

padding:12px 20px;

border-radius:50px;

color:white;

font-weight:bold;

display:flex;

gap:10px;

align-items:center;

}



.live-dot{

width:12px;

height:12px;

background:#22c55e;

border-radius:50%;

animation:blink 1s infinite;

}


@keyframes blink{

50%{

opacity:.3;

}

}


/* SLIDER */


.slider{

position:relative;

height:320px;

padding:25px;

background:#f8fafc;

overflow:hidden;

touch-action:pan-y;

cursor:grab;

}



.notice-card{

position:absolute;

top:25px;

left:100%;

width:calc(100% - 50px);

background:white;

padding:30px;

border-radius:22px;

opacity:0;

transition:.6s ease;

box-shadow:

0 15px 35px rgba(0,0,0,.08);

}



.notice-card.active{

left:25px;

opacity:1;

}



/* CARD STYLE */


.notice-card.new{

border-left:6px solid #22c55e;

}


.notice-card.update{

border-left:6px solid #f59e0b;

}


.notice-card.hot{

border-left:6px solid #ef4444;

}



.notice-badge{

display:inline-block;

padding:7px 18px;

border-radius:30px;

color:white;

font-size:12px;

font-weight:bold;

margin-bottom:15px;

}



.notice-badge.new{

background:#22c55e;

}


.notice-badge.update{

background:#f59e0b;

}


.notice-badge.hot{

background:#ef4444;

animation:flash 1s infinite;

}


@keyframes flash{

50%{

opacity:.4;

}

}


.notice-card h3{

font-size:23px;

color:#0f172a;

margin-bottom:12px;

}


.notice-card p{

font-size:16px;

color:#64748b;

line-height:1.6;

margin-bottom:20px;

}


.notice-btn{

display:inline-block;

background:#2563eb;

color:white;

padding:12px 25px;

border-radius:30px;

text-decoration:none;

font-weight:700;

transition:.3s;

}


.notice-btn:hover{

transform:translateY(-3px);

background:#1d4ed8;

}

<!-- NOTICE SLIDER CONTENT -->

<div class="notice-board">

<!-- Header already in Part 1 -->

<div class="slider" id="slider">


<!-- NOTICE 1 -->

<div class="notice-card new active">

<div class="notice-badge new">
NEW
</div>

<h3>
📚 Dr. Raushan Anand Sir PDF Notes
</h3>

<p>
Latest handwritten PDF Notes are available.
Download complete study material from Study Vector.
</p>

<a href="notes.html" class="notice-btn">
Download PDF
</a>

</div>



<!-- NOTICE 2 -->

<div class="notice-card update">

<div class="notice-badge update">
UPDATE
</div>


<h3>
📢 Contact Support
</h3>

<p>
Need any help? Contact our support team for queries and assistance.
</p>


<a href="Contact.html" class="notice-btn">
Open Contact
</a>

</div>



<!-- NOTICE 3 -->

<div class="notice-card hot">

<div class="notice-badge hot">
HOT
</div>


<h3>
🚔 Bihar Police Practice Set
</h3>


<p>
Bihar Police Practice Set PDF will be uploaded soon.
Stay connected with Study Vector.
</p>


<a href="#" class="notice-btn">
Coming Soon
</a>


</div>


</div>



<!-- CONTROLS -->


<div class="controls">

<button onclick="prevCard()">
❮
</button>


<button onclick="nextCard()">
❯
</button>

</div>



<div class="dots" id="dots"></div>



</div>



<style>


.controls{

text-align:center;

margin:25px 0;

}


.controls button{

width:50px;

height:50px;

border:none;

border-radius:50%;

background:#2563eb;

color:white;

font-size:22px;

cursor:pointer;

margin:0 8px;

box-shadow:0 10px 25px #2563eb55;

transition:.3s;

}



.controls button:hover{

transform:scale(1.1);

background:#1d4ed8;

}



.dots{

text-align:center;

}



.dot{

display:inline-block;

width:10px;

height:10px;

background:#cbd5e1;

border-radius:50%;

margin:5px;

}



.dot.active{

background:#2563eb;

}



@keyframes gridMove{

from{

transform:translateY(0);

}

to{

transform:translateY(35px);

}

}



@keyframes glowMove{

from{

transform:translate(0);

}

to{

transform:translate(-70px,70px);

}

}



@media(max-width:768px){


body{

padding:10px;

}


.notice-header{

flex-direction:column;

align-items:flex-start;

}


.notice-title h2{

font-size:22px;

}


.notice-status{

font-size:13px;

}


.slider{

height:350px;

}


.notice-card h3{

font-size:20px;

}


}



</style>





<script>


const cards=document.querySelectorAll(".notice-card");

const dotsBox=document.getElementById("dots");

let current=0;

let autoSlide;



/* CREATE DOTS */


cards.forEach((card,index)=>{


let dot=document.createElement("span");

dot.className="dot";


dot.onclick=()=>{

showCard(index);

};


dotsBox.appendChild(dot);


});



const dots=document.querySelectorAll(".dot");



function showCard(index){


cards.forEach(card=>{

card.classList.remove("active");

});


dots.forEach(dot=>{

dot.classList.remove("active");

});



cards[index].classList.add("active");

dots[index].classList.add("active");


current=index;


}




showCard(0);




function nextCard(){


current++;


if(current>=cards.length){

current=0;

}


showCard(current);


}



function prevCard(){


current--;


if(current<0){

current=cards.length-1;

}


showCard(current);


}




/* AUTO SLIDE */


function startAuto(){


autoSlide=setInterval(nextCard,4000);


}


startAuto();






/* MOBILE SWIPE */


let startX=0;


const slider=document.getElementById("slider");



slider.addEventListener("touchstart",(e)=>{


clearInterval(autoSlide);


startX=e.touches[0].clientX;


});




slider.addEventListener("touchend",(e)=>{


let endX=e.changedTouches[0].clientX;


if(startX-endX>50){

nextCard();

}



if(endX-startX>50){

prevCard();

}


startAuto();


});






/* DESKTOP DRAG */


let mouseStart=0;



slider.addEventListener("mousedown",(e)=>{


clearInterval(autoSlide);


mouseStart=e.clientX;


});




slider.addEventListener("mouseup",(e)=>{


let mouseEnd=e.clientX;


if(mouseStart-mouseEnd>50){

nextCard();

}


if(mouseEnd-mouseStart>50){

prevCard();

}


startAuto();


});



</script>
