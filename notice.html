<style>
.notice-board{
    width:92%;
    max-width:1200px;
    margin:90px auto 20px;
    padding:18px;
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:16px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
    font-family:Arial,sans-serif;
}

.notice-header{
    display:flex;
    align-items:center;
    gap:10px;
    padding-bottom:12px;
    margin-bottom:12px;
    border-bottom:1px solid #eee;
}

.notice-header h3{
    margin:0;
    font-size:22px;
    color:#222;
}

.notice-list{
    list-style:none;
    margin:0;
    padding:0;
}

.notice-item{
    display:flex;
    align-items:center;
    gap:10px;
    border-bottom:1px solid #f1f1f1;
    padding:12px 0;
}

.notice-item:last-child{
    border-bottom:none;
}

.notice-badge{
    background:#2563eb;
    color:#fff;
    padding:4px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
    flex-shrink:0;
}

.notice-badge.update{
    background:#ef4444;
}

.notice-scroll{
    flex:1;
    overflow:hidden;
    white-space:nowrap;
}

.notice-text{
    display:inline-block;
    color:#333;
    text-decoration:none;
    animation:scrollText 12s linear infinite;
}

.notice-text:hover{
    animation-play-state:paused;
    color:#2563eb;
}

.notice-date{
    color:#666;
    font-size:13px;
    margin-left:10px;
    flex-shrink:0;
}

@keyframes scrollText{
    from{
        transform:translateX(100%);
    }
    to{
        transform:translateX(-100%);
    }
}

@media(max-width:768px){

.notice-board{
    width:95%;
    margin:80px auto 20px;
}

.notice-header h3{
    font-size:18px;
}

.notice-item{
    gap:8px;
}

.notice-date{
    font-size:12px;
}

}
</style>

<div class="notice-board">

    <div class="notice-header">
        <span style="font-size:28px;">📢</span>
        <h3>Important Notices & Updates</h3>
    </div>

    <ul class="notice-list">

        <li class="notice-item">
            <span class="notice-badge">NEW</span>

            <div class="notice-scroll">
                <a href="notes.html" class="notice-text">
                    Semester 1 ke naye handwritten notes upload kar diye gaye hain!
                </a>
            </div>

            <span class="notice-date">25 July</span>
        </li>

        <li class="notice-item">
            <span class="notice-badge update">UPDATE</span>

            <div class="notice-scroll">
                <a href="Contact.html" class="notice-text">
                    Kisi bhi query ya help ke liye Contact page se direct message bhej sakte hain.
                </a>
            </div>

            <span class="notice-date">24 July</span>
        </li>

    </ul>

</div>
