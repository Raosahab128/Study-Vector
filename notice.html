<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Study Vector Notice Board</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{

background:linear-gradient(135deg,#eef6ff,#ffffff);

padding:25px;

}

/* Notice Board */

.notice-board{

width:100%;

max-width:1200px;

margin:auto;

background:#fff;

border-radius:22px;

overflow:hidden;

box-shadow:0 20px 50px rgba(0,0,0,.08);

border:1px solid #e5e7eb;

}

/* Header */

.notice-header{

padding:22px 30px;

display:flex;

justify-content:space-between;

align-items:center;

background:linear-gradient(135deg,#2563eb,#06b6d4);

color:#fff;

}

.notice-header h2{

font-size:28px;

font-weight:800;

}

.live{

display:flex;

align-items:center;

gap:8px;

font-weight:700;

}

.dot{

width:10px;

height:10px;

border-radius:50%;

background:#ff3b30;

animation:blink 1s infinite;

}

@keyframes blink{

50%{

opacity:.3;

}

}

/* Body */

.notice-body{

padding:25px;

}

/* Important Notice */

.notice-important{

display:flex;

justify-content:space-between;

align-items:center;

padding:18px 20px;

background:#fff7ed;

border-left:6px solid #f97316;

border-radius:15px;

margin-bottom:20px;

}

.notice-important-left{

display:flex;

align-items:center;

gap:15px;

}

.notice-pin{

font-size:24px;

}

.notice-title{

font-size:18px;

font-weight:700;

color:#111827;

}

.notice-date{

font-size:14px;

color:#6b7280;

margin-top:5px;

}

.new-badge{

background:#ef4444;

color:#fff;

padding:6px 14px;

border-radius:30px;

font-size:12px;

font-weight:700;

}

/* List */

.notice-list{

display:flex;

flex-direction:column;

gap:16px;

}

.notice-item{

display:flex;

justify-content:space-between;

align-items:center;

padding:18px 20px;

border-radius:16px;

background:#f8fafc;

transition:.3s;

border:1px solid transparent;

}

.notice-item:hover{

background:#fff;

border-color:#bfdbfe;

transform:translateY(-3px);

box-shadow:0 12px 25px rgba(0,0,0,.06);

}

.notice-left{

display:flex;

align-items:center;

gap:15px;

}

.notice-icon{

width:48px;

height:48px;

border-radius:50%;

display:flex;

justify-content:center;

align-items:center;

background:#dbeafe;

font-size:22px;

}

.notice-text h3{

font-size:17px;

color:#111827;

margin-bottom:5px;

}

.notice-text span{

font-size:13px;

color:#6b7280;

}

.view-btn{

padding:11px 22px;

border:none;

border-radius:40px;

background:linear-gradient(135deg,#2563eb,#06b6d4);

color:#fff;

font-weight:700;

cursor:pointer;

transition:.3s;

}

.view-btn:hover{

transform:translateY(-3px);

box-shadow:0 12px 25px rgba(37,99,235,.25);

}

@media(max-width:768px){

.notice-header{

flex-direction:column;

gap:10px;

text-align:center;

}

.notice-item{

flex-direction:column;

align-items:flex-start;

gap:18px;

}

.view-btn{

width:100%;

}

}

</style>

</head>

<body>

<div class="notice-board">

<div class="notice-header">

<h2>📢 Important Notices & Updates</h2>

<div class="live">

<div class="dot"></div>

LIVE

</div>

</div>

<div class="notice-body">

<div class="notice-important">

<div class="notice-important-left">

<div class="notice-pin">📌</div>

<div>

<div class="notice-title">

Welcome to Study Vector

</div>

<div class="notice-date">

Updated Today

</div>

</div>

</div>

<div class="new-badge">

NEW

</div>

</div>

<div class="notice-list">

<div class="notice-item">

<div class="notice-left">

<div class="notice-icon">

📚

</div>

<div class="notice-text">

<h3>Khan Sir Notes Updated</h3>

<span>26 July 2026</span>

</div>

</div>

<button class="view-btn">

View

</button>

</div>

<div class="notice-item">

<div class="notice-left">

<div class="notice-icon">

🎓

</div>

<div class="notice-text">

<h3>New Practice Set Uploaded</h3>

<span>25 July 2026</span>

</div>

</div>

<button class="view-btn">

View

</button>

</div>
<!-- Notice 3 -->

<div class="notice-item">

<div class="notice-left">

<div class="notice-icon">

</div>

<div class="notice-text">

<h3>Weekly Quiz Available</h3>

<span>24 July 2026</span>

</div>

</div>

<button class="view-btn">
View
</button>

</div>

<!-- Notice 4 -->

<div class="notice-item">

</div>

<div class="notice-text">

<h3>Community Group Updated</h3>

<span>22 July 2026</span>

</div>

</div>

<button class="view-btn">
View
</button>

</div>

<!-- Notice 5 -->

<div class="notice-item">

<div class="notice-left">

<div class="notice-icon">

</div>

<div class="notice-text">

<h3>Topper Notes Uploaded</h3>

View
</button>

</div>

</div>

</div>

</div>

<script>

/* View Button */

document.querySelectorAll(".view-btn").forEach(btn=>{

btn.addEventListener("click",()=>{

alert("Notice details will be available soon.");

});

});

/* Auto Highlight */

const notices=document.querySelectorAll(".notice-item");

let current=0;

function highlightNotice(){

notices.forEach(item=>{

item.style.border="1px solid transparent";

item.style.transform="scale(1)";

});

notices[current].style.border="2px solid #2563eb";

notices[current].style.transform="scale(1.02)";

current++;

if(current>=notices.length){

current=0;

}

}

highlightNotice();

setInterval(highlightNotice,3000);

</script>

</body>
</html>
